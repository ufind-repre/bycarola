  <script>
/* Regras de domínio independentes da interface. Sem framework e sem acesso ao DOM. */
(function (root) {
  'use strict';
  const STAGES = [
    { name:'Desenvolvimento', phase:'piloto', hint:'Desenho e conceito da peça', files:'drawing' },
    { name:'Modelagem', phase:'piloto', hint:'Modelagem da peça piloto' },
    { name:'Plotagem', phase:'piloto', hint:'Arquivo de desenvolvimento da piloto', files:'pilot' },
    { name:'Corte', phase:'piloto', hint:'Corte da peça piloto' },
    { name:'Costura', phase:'piloto', hint:'Costura da peça piloto' },
    { name:'Prova', phase:'piloto', hint:'Vestibilidade e ajustes da piloto' },
    { name:'Ampliação', phase:'producao', hint:'Modelagem de cada tamanho', files:'sizes' },
    { name:'Plotagem Produção', phase:'producao', hint:'Preparação do risco de produção' },
    { name:'Corte', phase:'producao', hint:'Corte do lote de produção' },
    { name:'Aviamento', phase:'producao', hint:'Aviamentos e etiqueta de composição', label:'composition' },
    { name:'Costura', phase:'producao', hint:'Costura e etiqueta de código de barras', label:'barcode' },
    { name:'Controle de qualidade', phase:'qualidade', hint:'Avaliação final e entrada em estoque' }
  ];
  const STATES=['A iniciar','Em andamento','Concluída'];
  const APPROVALS=['Aprovado','Aprovado com observação','Reprovado'];
  const clone = obj => JSON.parse(JSON.stringify(obj));
  const now = () => new Date().toISOString();
  const today = () => new Date().toLocaleDateString('en-CA');
  const shift = days => { const d = new Date(); d.setDate(d.getDate()+days); return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'); };
  const assert = (ok,msg) => { if(!ok) throw new Error(msg); };
  const number = (n,min=0) => { n=Number(n); assert(Number.isFinite(n)&&n>=min,'Informe uma quantidade válida.'); return n; };
  const integer = (n,min=0) => { n=number(n,min); assert(Number.isInteger(n),'As quantidades de peças devem ser inteiras.'); return n; };
  const uid = (s,prefix) => `${prefix}-${String(++s.sequence).padStart(4,'0')}`;
  const person = (s,id) => s.people.find(p=>p.id===id);
  const piece = (s,id) => { const p=s.pieces.find(p=>p.id===id); assert(p,'Peça não encontrada.'); return p; };
  const actor = s => person(s,s.actor)?.name || 'Equipe de produção';
  const record = (s,p,text,kind='alteracao') => p.history.unshift({id:uid(s,'H'),date:now(),actor:actor(s),text,kind});
  const total = p => p.grade.reduce((sum,g)=>sum+g.qty,0);
  const labelBy = (s,id,type) => s.labels.find(l=>l.id===id && l.type===type);
  const validOwner = (s,id) => assert(person(s,id)?.active,'Selecione um responsável ativo para a etapa.');
  const dateOK = d => /^\d{4}-\d{2}-\d{2}$/.test(d) && !isNaN(new Date(d+'T12:00:00').getTime());
  function createAccessPolicy(initial={}){let edit=initial.edit!==false,exportAllowed=initial.export!==false;return {get canEdit(){return edit},get canExport(){return exportAllowed},update(next={}){if(typeof next.edit==='boolean')edit=next.edit;if(typeof next.export==='boolean')exportAllowed=next.export;},assertEdit(){assert(edit,'Acesso somente para consulta. Você não pode alterar a produção.');},assertExport(){assert(exportAllowed,'Seu usuário não tem permissão para exportar, imprimir ou baixar anexos.');}};}
  function grade(rows) {
    const result=(rows||[]).map(r=>({size:String(r.size||'').trim().toUpperCase(),qty:integer(r.qty)})).filter(r=>r.size&&r.qty>0);
    assert(result.length,'Informe pelo menos um tamanho com quantidade maior que zero.');
    assert(new Set(result.map(r=>r.size)).size===result.length,'Cada tamanho deve aparecer uma única vez.');
    assert(result.length<=15,'Use até 15 tamanhos por peça.'); return result;
  }
  function validatePiece(s,data,id) {
    const ref=String(data.ref||'').trim().toUpperCase(),name=String(data.name||'').trim();
    assert(ref&&name,'Informe a referência e o nome da peça.');
    const lot=String(data.lot||'').trim()||('L-'+today().replaceAll('-','')+'-'+String(s.sequence+1));assert(!s.pieces.some(p=>p.id!==id&&p.ref.toUpperCase()===ref&&String(p.color||'').toLowerCase()===String(data.color||'').trim().toLowerCase()&&p.lot===lot),'Essa referência, cor e lote já estão cadastrados.');
    assert(dateOK(data.due),'Informe uma data de entrega válida.');
    return {ref,name,lot,color:String(data.color||'').trim(),collection:String(data.collection||'').trim(),category:data.category||'Vestido',priority:data.priority==='Alta'?'Alta':'Normal',due:data.due,grade:grade(data.grade)};
  }
  function addPiece(s,data) {
    const v=validatePiece(s,data); validOwner(s,data.owner);
    const p={id:uid(s,'PC'),...v,stage:0,created:now(),finished:false,archived:false,quality:null,compositionLabel:data.compositionLabel||null,barcodeLabel:data.barcodeLabel||null,sourcePieceId:data.sourcePieceId||null,
      steps:STAGES.map((_,i)=>({owner:i===0?data.owner:'',status:i===0?'Em andamento':'A iniciar',notes:'',files:[],started:i===0?now():null,completed:null})),history:[]};
    s.pieces.unshift(p); record(s,p,data.sourcePieceId?'Nova produção copiada de '+data.sourcePieceId+'. Novo lote, início em Desenvolvimento.':'Peça criada. Início em Desenvolvimento.','criacao'); return p;
  }
  function editPiece(s,id,data) {
    const p=piece(s,id); assert(!p.finished,'Peças finalizadas preservam os dados da entrada em estoque.');
    const v=validatePiece(s,data,id),changes=[];
    if(p.stage>6&&v.grade.some(g=>!p.steps[6].files.some(f=>f.size===g.size)))assert(false,'Para incluir novos tamanhos, retorne a peça à Ampliação e anexe os moldes correspondentes.');
    const names={lot:'Lote',ref:'Referência',name:'Nome',color:'Cor',collection:'Coleção',category:'Categoria',priority:'Prioridade',due:'Prazo',grade:'Grade'};
    for(const k of Object.keys(v)) if(JSON.stringify(v[k])!==JSON.stringify(p[k])) changes.push(k==='grade'?`${names[k]} atualizada`: `${names[k]}: ${p[k]||'—'} → ${v[k]||'—'}`);
    if(changes.length){Object.assign(p,v);record(s,p,changes.join(' · '));} return p;
  }
  function requirements(s,p,index=p.stage) {
    const step=p.steps[index],spec=STAGES[index],missing=[];
    if(!person(s,step.owner)?.active)missing.push('responsável ativo');
    if(spec.files && spec.files!=='sizes' && !step.files.length)missing.push('anexo da etapa');
    if(spec.files==='sizes')for(const g of p.grade)if(!step.files.some(f=>f.size===g.size))missing.push(`anexo do tamanho ${g.size}`);
    if(spec.label==='composition'&&!labelBy(s,p.compositionLabel,'composition'))missing.push('etiqueta de composição');
    if(spec.label==='barcode'&&!labelBy(s,p.barcodeLabel,'barcode'))missing.push('etiqueta de código de barras');
    return missing;
  }
  function updateStep(s,id,data) {
    const p=piece(s,id); assert(!p.finished,'Esta produção já foi finalizada.');
    const t=p.steps[p.stage],before=clone(t),changes=[]; validOwner(s,data.owner);

  function materials(){const rows=S.materials.filter(m=>(m.name+' '+m.color).toLowerCase().includes(U.q.toLowerCase()));return `<div class="page-head"><div><div class="eyebrow">Cadastros de apoio</div><h1>Matérias-primas</h1><p>Composição têxtil e entradas dos materiais utilizados nas peças.</p></div><div class="page-actions">${btn('Registrar entrada','receive-material','','','plus')}${btn('Nova matéria-prima','edit-material','','primary','plus')}</div></div><div class="toolbar mb"><label class="searchbox">${icon('search')}<input id="search" data-filter="q" value="${esc(U.q)}" placeholder="Buscar material ou cor…" aria-label="Buscar matérias-primas"></label>${btn('Histórico de entradas','material-history','','','history')}</div><div class="material-grid">${rows.map(m=>`<article class="card material-card"><div class="space">${badge('Matéria-prima',m.active?'green':'')}${ibtn('Editar '+m.name,'edit-material',m.id,'edit')}</div><h3 class="mt">${esc(m.name)} ${!m.active?badge('Inativa'):''}</h3><p class="small muted">${esc(m.color||'Sem cor')} · ${esc(m.supplier||'Sem fornecedor')}</p><div class="balance">${num(D.materialBalance(S,m.id))} <small>${esc(m.unit)} recebidos</small></div><div class="composition">${esc(compositionText(m.composition))}<br><b>Total informado: ${num(m.composition.reduce((a,c)=>a+c.percent,0))}%</b>${m.yield?.kg?`<p class="mt">Rendimento: ${num(m.yield.kg)} kg × ${num(m.yield.metersPerKg)} m/kg = <b>${num(m.yield.meters)} m</b></p>`:''}</div><footer><span class="small muted">${S.materialEntries.filter(e=>e.materialId===m.id).length} entrada(s)</span>${m.active?btn('Registrar entrada','receive-material',m.id,'sm','plus'):''}</footer></article>`).join('')}</div>${!rows.length?empty('Nenhuma matéria-prima encontrada.'):''}<p class="muted-note">Neste módulo, as entradas formam o saldo inicial de matéria-prima. Reservas, consumo e demais movimentações serão tratados no módulo de estoque.</p>`;}

  function barcodeSVG(code){const L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'],G=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'],R=L.map(s=>[...s].map(n=>n==='0'?'1':'0').join('')),P=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];let bits='101';for(let i=1;i<=6;i++)bits+=(P[Number(code[0])][i-1]==='L'?L:G)[Number(code[i])];bits+='01010';for(let i=7;i<13;i++)bits+=R[Number(code[i])];bits+='101';return `<svg class="barcode-svg" viewBox="0 0 117 65" role="img" aria-label="Código EAN-13 ${esc(code)}" xmlns="http://www.w3.org/2000/svg"><rect width="117" height="65" fill="white"/>${[...bits].map((b,i)=>b==='1'?`<rect x="${i+11}" y="1" width="1" height="${i<3||i>91||(i>=45&&i<50)?48:43}" fill="#111"/>`:'').join('')}<text x="58.5" y="61" text-anchor="middle" font-family="monospace" font-size="9" letter-spacing="1">${esc(code)}</text></svg>`;}

  function settings(){if(embedded)return integratedSettings();return `<div class="page-head"><div><div class="eyebrow">Ambiente de demonstração</div><h1>Dados e orientações</h1><p>Seu protótipo, pronto para explorar o processo completo.</p></div></div><div class="settings-grid"><section class="card"><h2>Backup da demonstração</h2><p>Exporta os cadastros, peças, anexos e históricos. Use o arquivo JSON para transportar a demonstração entre navegadores ou computadores.</p>${btn('Exportar backup completo','export-backup','','primary','download')}</section><section class="card"><h2>Restaurar um backup</h2><p>A restauração substitui os dados deste navegador. Exporte um backup antes de importar outra versão.</p><input class="data-file" id="import-backup" type="file" accept="application/json,.json" aria-label="Importar backup JSON"></section><section class="card"><h2>Como percorrer a produção</h2><ol class="settings-guide"><li>Cadastre a peça com referência, grade, prazo e responsável.</li><li>Abra o card, atualize o status e inclua os arquivos da etapa.</li><li>Conclua e avance, escolhendo o próximo responsável.</li><li>Na ampliação, associe os anexos a cada tamanho da grade.</li><li>Vincule as etiquetas nas etapas de aviamento e costura.</li><li>Avalie a qualidade e distribua as quantidades por classificação.</li></ol></section><section class="card"><h2>Sobre esta versão</h2><p>Este módulo simula a produção no navegador. Não há autenticação de servidor ou sincronização entre dispositivos. Neste protótipo integrado, as finalizações são enviadas ao estoque do painel principal. O usuário selecionado identifica quem registrou cada alteração.</p><p>Os anexos ficam salvos neste navegador, junto dos demais dados. Limpar os dados do navegador remove a demonstração local. Use o backup para preservar seu trabalho.</p>${btn('Reiniciar demonstração','reset-demo','','danger','history')}</section></div>`;}

      ${spec.files?`<div class="mt"><div class="space"><h3>${spec.files==='sizes'?'Arquivos por tamanho':'Anexos da etapa'}</h3>${badge(t.files.length+' arquivo(s)')}</div>${spec.files==='sizes'?p.grade.map(g=>`<div class="size-file-group"><div class="space"><b class="small">Tamanho ${esc(g.size)} <span class="muted">· ${g.qty} peças</span></b>${badge(t.files.some(f=>f.size===g.size)?'Anexo incluído':'Anexo pendente',t.files.some(f=>f.size===g.size)?'green':'amber')}</div>${t.files.filter(f=>f.size===g.size).map(f=>fileRow(p,f,editable)).join('')}${editable?uploadZone(g.size):''}</div>`).join(''):t.files.map(f=>fileRow(p,f,editable)).join('')+(editable?uploadZone():'')}${spec.files==='sizes'&&t.files.some(f=>!p.grade.some(g=>g.size===f.size))?'<div class="mt"><b class="small">Anexos de tamanhos removidos da grade</b>'+t.files.filter(f=>!p.grade.some(g=>g.size===f.size)).map(f=>fileRow(p,f,editable)).join('')+'</div>':''}</div>`:''}
      ${index===11?qualityPanel(p):''}${editable?requirementsMarkup(p):''}<div id="piece-error" class="form-error" role="alert"></div>`;}
  function labelLink(id,editable,type){const l=S.labels.find(l=>l.id===id);return (l?`<div class="mini-label-preview">${icon('tag')}<div class="grow"><b>${esc(l.name)}</b><p>${esc(type==='composition'?compositionText(l.composition):l.code)}</p></div>${btn('Ver etiqueta','preview-label',l.id,'sm','eye')}</div>`:'')+(editable?`<div class="mt">${btn('Criar etiqueta de '+(type==='composition'?'composição':'código de barras'),'create-stage-label',type,'sm plain','plus')}</div>`:'');}
  function qualityPanel(p){if(p.finished){const q=p.quality;return `<section class="card mt"><div class="space"><h3>Avaliação final</h3>${badge(q.approval,q.approval==='Reprovado'?'red':q.approval==='Aprovado'?'green':'amber')}</div><p class="small muted mt">${esc(q.note||'Produção aprovada sem observações.')}</p><div class="summary-stats mt"><div><span>Normal</span><b>${qualitySum(p,'normal')}</b></div><div><span>Segunda linha</span><b>${qualitySum(p,'second')}</b></div><div><span>Rejeitadas</span><b>${qualitySum(p,'rejected')}</b></div></div><p class="small muted mt">${q.entryId?'Entrada '+esc(q.entryId):'Sem entrada em estoque'} · ${datetime(q.date)} · ${esc(ownerName(q.owner))}</p></section>`;}return `<section class="card mt"><h3>Preparar a entrada em estoque</h3><p class="small muted mt">Avalie a produção e distribua a grade entre peças normais, de segunda linha e rejeitadas. A avaliação e a classificação são campos separados.</p><div class="row mt">${badge(D.total(p)+' peças previstas','green')}${badge(p.grade.map(g=>g.size).join(' · '))}</div></section>`;}
  function pieceSummary(p){return `<div class="space mb"><h3>Ficha da peça</h3><span class="row">${btn('Copiar para nova produção','copy-piece',p.id,'sm','copy')}${!p.finished&&!p.archived?btn('Editar ficha','edit-piece',p.id,'sm','edit'):''}</span></div><div class="detail-data"><div><span>Lote</span><strong>${esc(p.lot||p.id)}</strong></div><div><span>Referência</span><strong>${esc(p.ref)}</strong></div><div><span>Categoria</span><strong>${esc(p.category)}</strong></div><div><span>Cor</span><strong>${esc(p.color||'—')}</strong></div><div><span>Coleção</span><strong>${esc(p.collection||'—')}</strong></div><div><span>Previsão de entrega</span><strong>${date(p.due)}</strong></div><div><span>Prioridade</span><strong>${esc(p.priority)}</strong></div></div><h3 class="mt mb">Grade de produção</h3><div class="table-wrap"><table><thead><tr><th>TAMANHO</th><th class="num">QUANTIDADE</th></tr></thead><tbody>${p.grade.map(g=>`<tr><td>${esc(g.size)}</td><td class="num">${g.qty}</td></tr>`).join('')}</tbody></table><div class="table-footer">Total: ${num(D.total(p))} peças</div></div><div class="mt">${labelLink(p.compositionLabel,false,'composition')}${labelLink(p.barcodeLabel,false,'barcode')}</div><div class="row mt">${btn('Imprimir ficha','print-piece',p.id,'','print')}${!p.finished?btn(p.archived?'Restaurar ao quadro':'Arquivar peça','archive-piece',p.id,'plain','archive'):''}</div>`;}
  function renderPiece(){const p=D.piece(S,currentId);const editable=permissions.canEdit&&!p.finished&&!p.archived,viewCurrent=viewedStage===p.stage;$('#piece-dialog').innerHTML=`<div class="piece-dialog-head"><div class="row">${garment(p.category,p.color)}<div><div class="ref">${esc(p.ref)} · ${esc(p.collection)}</div><h2 id="piece-dialog-title">${esc(p.name)}</h2><small>${esc(p.color)} · ${D.total(p)} peças · Previsão ${date(p.due)}</small></div></div><div class="row">${p.priority==='Alta'?badge('Prioridade alta','amber'):''}${ibtn('Fechar peça','close-piece')}</div></div><div class="piece-dialog-body"><aside class="stage-rail" aria-label="Etapas da peça"><div class="rail-label">Jornada da peça</div>${D.STAGES.map((s,i)=>`<button class="stage-link ${p.steps[i].status==='Concluída'?'done':''} ${i===p.stage?'current':''} ${i===viewedStage&&detailTab==='stage'?'viewed':''}" data-action="view-stage" data-id="${i}"><span class="step-number">${p.steps[i].status==='Concluída'?icon('check'):String(i+1).padStart(2,'0')}</span><span class="stage-link-copy"><strong>${s.name}</strong><small>${i===p.stage&&!p.finished?'Etapa atual':p.steps[i].status==='Concluída'?'Concluída':'A seguir'}</small></span></button>`).join('')}</aside><section class="piece-main"><div class="detail-tabs">${[['stage','Etapa'],['info','Ficha da peça'],['history','Histórico · '+p.history.length]].map(([id,label])=>`<button data-action="detail-tab" data-id="${id}" class="${detailTab===id?'active':''}">${label}</button>`).join('')}</div>${detailTab==='stage'?stageContents(p,viewedStage):detailTab==='info'?pieceSummary(p):`<div class="stage-title"><h3>Histórico de alterações</h3><p>Movimentações, responsáveis, observações e arquivos em uma linha do tempo.</p></div><div class="timeline">${p.history.map(h=>`<div class="timeline-item"><p>${esc(h.text)}</p><small>${esc(h.actor)} · ${datetime(h.date)}</small></div>`).join('')}</div>`}</section></div><footer class="piece-bottom"><div>${editable&&p.stage>0?btn('<   function getStageDraft(){const f=$('#stage-form');if(!f||Number(f.dataset.index)!==D.piece(S,currentId).stage)return null;const data=Object.fromEntries(new FormData(f));return data;}

  function gradeRow(g={size:'',qty:0}){return `<div class="grade-row"><input name="gradeSize" value="${esc(g.size)}" placeholder="Tamanho, ex.: P" aria-label="Tamanho" maxlength="15" required><input name="gradeQty" type="number" min="0" max="1000000" step="1" value="${g.qty}" aria-label="Quantidade por tamanho" required>${ibtn('Remover tamanho','remove-row','','trash')}</div>`;}
  function rowsFrom(form,selector,mapper){return [...form.querySelectorAll(selector)].map(mapper);}
  function pieceForm(id,copy=false){const source=id?D.piece(S,id):null,p=source,editing=!!p&&!copy,lot=editing?(p.lot||p.id):'L-'+D.today().replaceAll('-','')+'-'+String(S.sequence+1);const fields=`${copy?'<div class="notice green mb">A ficha e a grade foram copiadas. Escolha a cor e confira os dados. A nova produção começa em Desenvolvimento, com lote próprio e sem repetir as movimentações ou os anexos da produção anterior.</div>':''}<div class="form-grid">${field('Referência do modelo *','ref',p?.ref||'','text','required maxlength="40" placeholder="Ex.: CAR-115"')}${field('Lote desta produção *','lot',lot,'text','required maxlength="70"')}${field('Nome da peça *','name',p?.name||'','text','required maxlength="90" placeholder="Ex.: Vestido Aurora"')}${select('Categoria','category',['Vestido','Blusa','Camisa','Calça','Saia','Shorts','Conjunto','Outro'],p?.category||'Vestido')}${field('Cor','color',copy?'':p?.color||'','text','maxlength="40" placeholder="Ex.: Areia"')}${field('Coleção','collection',p?.collection||'Essência · Verão 2027','text','maxlength="90"')}${field('Previsão de entrega *','due',copy?D.shift(14):p?.due||D.shift(14),'date','required')}${select('Prioridade','priority',['Normal','Alta'],p?.priority||'Normal')}${!editing?select('Responsável pelo desenvolvimento *','owner',ownerOpts(),S.actor,'required'):''}<div class="wide"><div class="form-section-title">Grade de produção *</div>${gradeRows(p?.grade||[{size:'P',qty:10},{size:'M',qty:20},{size:'G',qty:10}])}<p class="field-help">A referência identifica o modelo. Cor e lote distinguem cada produção. As quantidades serão classificadas no controle de qualidade.</p></div>${copy?`<label class="checkbox wide"><input type="checkbox" name="copyLabels" checked> Reutilizar os modelos de etiquetas vinculados à peça de origem</label>`:''}</div>`;
    showDialog(copy?'Copiar peça para nova produção':editing?'Editar ficha da peça':'Nova peça',fields,async form=>{const data=Object.fromEntries(new FormData(form));data.grade=rowsFrom(form,'.grade-row',r=>({size:r.querySelector('[name=gradeSize]').value,qty:r.querySelector('[name=gradeQty]').value}));if(copy){data.sourcePieceId=p.id;if(form.elements.copyLabels.checked){data.compositionLabel=p.compositionLabel;data.barcodeLabel=p.barcodeLabel;}}const result=await mutate(s=>editing?D.editPiece(s,id,data):D.addPiece(s,data),editing?'Ficha atualizada.':'Nova produção criada no desenvolvimento.',false);$('#dialog').close();openPiece(result.id);},{submitLabel:editing?'Salvar alterações':'Criar produção',subtitle:editing?'As alterações serão registradas no histórico.':'A produção começa na etapa 01 · Desenvolvimento.'});

  function prepareStep(s,id,draft){if(draft)D.updateStep(s,id,draft);}
  function movePiece(id,target){permissions.assertEdit();const p=D.piece(S,id);if(p.archived){toast('Restaure a peça antes de movimentar.',true);return;}if(target===p.stage)return;if(target>p.stage+1){toast('Avance uma etapa por vez para preservar os registros.',true);return;}
    if(target<p.stage){returnPiece(id,target);return;}const draft=currentId===id?getStageDraft():null;const preview=D.clone(S);prepareStep(preview,id,draft);const m=D.requirements(preview,D.piece(preview,id));if(m.length){toast('Para avançar, informe: '+m.join(', ')+'.',true);if(!$('#piece-dialog').open)openPiece(id);return;}
    showDialog('Concluir e avançar',`<p class="description"><strong>${esc(p.name)}</strong> passará de <strong>${p.stage+1}. ${D.STAGES[p.stage].name}</strong> para <strong>${target+1}. ${D.STAGES[target].name}</strong>.</p>${select('Responsável pela próxima etapa *','owner',ownerOpts(),p.steps[target].owner||p.steps[p.stage].owner,'required')}<div class="notice green mt">Os anexos, observações e responsáveis da etapa concluída permanecerão no histórico.</div>`,async form=>{const owner=new FormData(form).get('owner');await mutate(s=>{prepareStep(s,id,draft);D.advance(s,id,owner);},'Peça movimentada.',false);$('#dialog').close();if($('#piece-dialog').open){viewedStage=D.piece(S,id).stage;renderPiece();}},{submitLabel:'Concluir e avançar'});

  function returnPiece(id,target=null,reopening=false){const p=D.piece(S,id),draft=currentId===id?getStageDraft():null;showDialog(reopening?'Enviar para retrabalho':'Retornar a uma etapa',`<p class="description">Os dados anteriores serão preservados. As etapas a partir do retorno precisarão ser concluídas novamente.</p><div class="form-grid">${select('Etapa de retorno *','target',D.STAGES.slice(0,p.stage).map((s,i)=>[i,`${i+1}. ${s.name}`]),target??p.stage-1,'required')}${select('Responsável *','owner',ownerOpts(),p.steps[Math.max(0,target??p.stage-1)].owner||S.actor,'required')}${area('Motivo do retorno *','reason','','required placeholder="Descreva o ajuste necessário…"')}</div>`,async form=>{const data=Object.fromEntries(new FormData(form));await mutate(s=>{if(!reopening)prepareStep(s,id,draft);if(reopening)D.reopen(s,id,Number(data.target),data.owner,data.reason);else D.rewind(s,id,Number(data.target),data.owner,data.reason);},'Peça encaminhada para retrabalho.',false);$('#dialog').close();viewedStage=D.piece(S,id).stage;detailTab='stage';renderPiece();},{submitLabel:'Confirmar retorno'});}
  function finalForm(id){const p=D.piece(S,id),draft=currentId===id?getStageDraft():null;showDialog('Controle de qualidade',`<p class="description"><strong>${esc(p.name)} · ${esc(p.ref)}</strong><br>Confira a grade e classifique todas as ${D.total(p)} peças antes de finalizar.</p><div class="form-grid">${select('Avaliação final *','approval',[['','Selecione a avaliação'],...D.APPROVALS],'','required')}${select('Responsável pela avaliação *','owner',ownerOpts(),draft?.owner||p.steps[11].owner,'required')}${area('Observações da avaliação','note','','placeholder="Obrigatórias em caso de ressalvas, segunda linha ou rejeições."')}</div><h3 class="mt mb">Classificação das quantidades</h3><div class="table-wrap"><table class="quality-table"><thead><tr><th>TAMANHO</th><th>PREVISTAS</th><th>NORMAL</th><th>2ª LINHA</th><th>REJEITADAS</th></tr></thead><tbody>${p.grade.map(g=>`<tr data-quality-size="${esc(g.size)}" data-planned="${g.qty}"><td><b>${esc(g.size)}</b></td><td>${g.qty}</td><td><input type="number" min="0" step="1" name="normal" value="${g.qty}" aria-label="Normal tamanho ${esc(g.size)}" required></td><td><input type="number" min="0" step="1" name="second" value="0" aria-label="Segunda linha tamanho ${esc(g.size)}" required></td><td><input type="number" min="0" step="1" name="rejected" value="0" aria-label="Rejeitada tamanho ${esc(g.size)}" required></td></tr>`).join('')}</tbody></table></div><div class="quality-total" id="quality-total"></div><div class="notice green mt">Peças normais e de segunda linha gerarão um único registro de entrada. Rejeitadas ficam fora do estoque. A finalização preserva os dados desta produção.</div>`,async form=>{const data=Object.fromEntries(new FormData(form));data.rows=rowsFrom(form,'[data-quality-size]',r=>({size:r.dataset.qualitySize,normal:r.querySelector('[name=normal]').value,second:r.querySelector('[name=second]').value,rejected:r.querySelector('[name=rejected]').value}));await mutate(s=>{prepareStep(s,id,draft);D.updateStep(s,id,{...D.piece(s,id).steps[11],owner:data.owner,status:'Em andamento'});D.finish(s,id,data);},data.approval==='Reprovado'?'Produção reprovada, sem entrada em estoque.':'Produção finalizada e entrada registrada.',false);$('#dialog').close();viewedStage=11;detailTab='stage';renderPiece();},{submitLabel:'Confirmar finalização',wide:true});updateQualityTotals();}
  function updateQualityTotals(){const el=$('#quality-total');if(!el)return;let normal=0,second=0,rejected=0,valid=true;$$('[data-quality-size]').forEach(r=>{const n=Number(r.querySelector('[name=normal]').value),s=Number(r.querySelector('[name=second]').value),j=Number(r.querySelector('[name=rejected]').value);normal+=n;second+=s;rejected+=j;if(n+s+j!==Number(r.dataset.planned)||[n,s,j].some(x=>!Number.isInteger(x)||x<0)){valid=false;r.style.background='var(--red-soft)';}else r.style.background='';});el.innerHTML=`<span>Normal: <b>${normal}</b></span><span>2ª linha: <b>${second}</b></span><span>Rejeitadas: <b>${rejected}</b></span><span class="${valid?'green':'red'}">${valid?'Grade conferida':'Confira as quantidades por tamanho'}</span>`;}

  function materialForm(id){const m=S.materials.find(m=>m.id===id);showDialog(m?'Editar matéria-prima':'Nova matéria-prima',`<div class="form-grid">${field('Nome do material *','name',m?.name||'','text','required maxlength="90"')}${select('Unidade de estoque','unit',[['m','Metros (m)'],['kg','Quilogramas (kg)'],['un','Unidades (un)']],m?.unit||'m')}${field('Cor','color',m?.color||'','text','maxlength="40"')}${field('Fornecedor','supplier',m?.supplier||'','text','maxlength="100"')}<section class="wide form-section"><h3>Rendimento do tecido</h3><p class="field-help mb">Informe o peso e quantos metros cada quilo rende. A conversão fica salva no cadastro.</p><div class="form-grid">${field('Peso do tecido (kg)','kilos',m?.yield?.kg||0,'number','min="0" step="0.001" data-yield')}${field('Rendimento de 1 kg (metros)','yieldRate',m?.yield?.metersPerKg||0,'number','min="0" step="0.001" data-yield')}</div><div class="notice green mt" id="yield-output"></div><label class="checkbox mt"><input type="checkbox" name="receiveYield" ${m?'':'checked'}> ${m?'Registrar este peso como uma nova entrada de material':'Registrar o peso convertido como entrada inicial'}</label><p class="field-help">Editar o cadastro não altera entradas anteriores. Marque a opção apenas para um novo recebimento. Em metros, entra kg × rendimento; em kg, entra o peso informado.</p></section><div class="wide"><div class="form-section-title">Composição têxtil do material (%)</div><div class="grade-rows" id="composition-rows">${(m?.composition||[{fiber:'',percent:100}]).map(compositionRow).join('')}</div><div class="mt">${btn('Adicionar fibra','add-fiber','','sm plain','plus')}</div><div class="field-help" id="material-composition-total"></div><p class="field-help">Percentuais livres, inclusive acima de 100%. Os valores informados são preservados, sem ajuste automático.</p></div><label class="checkbox wide"><input type="checkbox" name="active" ${m?.active!==false?'checked':''}> Matéria-prima ativa</label></div>`,async form=>{const data=Object.fromEntries(new FormData(form));data.active=form.elements.active.checked;data.composition=rowsFrom(form,'.composition-row',r=>({fiber:r.querySelector('[name=fiber]').value,percent:r.querySelector('[name=fiberPercent]').value}));await mutate(s=>{const material=D.upsertMaterial(s,data,id);if(form.elements.receiveYield.checked&&material.yield.kg>0){D.assert(material.unit!=='un','Para converter rendimento, escolha metros ou quilogramas.');if(material.unit==='m')D.assert(material.yield.metersPerKg>0,'Informe o rendimento em metros por quilo.');D.receiveMaterial(s,{materialId:material.id,qty:material.unit==='m'?material.yield.meters:material.yield.kg,unitCost:0,date:D.today(),lot:'RENDIMENTO-'+D.uid(s,'LOT'),supplier:material.supplier,note:'Entrada pelo rendimento: '+material.yield.kg+' kg × '+material.yield.metersPerKg+' m/kg = '+material.yield.meters+' m.'});}},'Matéria-prima e rendimento salvos.');$('#dialog').close();});updateYield();updateMaterialCompositionTotal();}
  function updateYield(){const f=$('#modal-form'),out=$('#yield-output');if(!f||!out)return;const kg=Number(f.elements.kilos.value||0),rate=Number(f.elements.yieldRate.value||0);out.innerHTML=`<strong>${num(kg*rate)} metros</strong> disponíveis pelo rendimento informado <span class="muted">(${num(kg)} kg × ${num(rate)} m/kg)</span>`;}
  function updateMaterialCompositionTotal(){const out=$('#material-composition-total');if(out)out.textContent='Total informado: '+num($$('.composition-row input[name=fiberPercent]').reduce((a,input)=>a+Number(input.value||0),0))+'%';}
  function receiveForm(id){showDialog('Registrar entrada de matéria-prima',`<div class="form-grid"><div class="wide">${select('Matéria-prima *','materialId',[['','Selecione'],...S.materials.filter(m=>m.active).map(m=>[m.id,m.name+' · '+m.unit])],id,'required')}</div>${field('Quantidade recebida *','qty','','number','required min="0.001" step="0.001"')}${field('Custo por unidade (R$)','unitCost','0','number','required min="0" step="0.01"')}${field('Data de entrada *','date',D.today(),'date','required max="'+D.today()+'"')}${field('Lote / documento','lot','','text','maxlength="80"')}${field('Fornecedor','supplier',S.materials.find(m=>m.id===id)?.supplier||'','text','maxlength="100"')}${area('Observação','note')}</div>`,async form=>{const data=Object.fromEntries(new FormData(form));await mutate(s=>D.receiveMaterial(s,data),'Entrada de matéria-prima registrada.');$('#dialog').close();},{subtitle:'A quantidade será somada ao saldo recebido do material.',submitLabel:'Registrar entrada'});}
  function materialHistory(){showDialog('Histórico de entradas',S.materialEntries.length?`<div class="table-wrap"><table><thead><tr><th>DATA / LOTE</th><th>MATÉRIA-PRIMA</th><th class="num">QUANTIDADE</th><th class="num">CUSTO TOTAL</th><th>REGISTRADO POR</th></tr></thead><tbody>${S.materialEntries.map(e=>{const m=S.materials.find(m=>m.id===e.materialId);return `<tr><td>${date(e.date)}<small>${esc(e.lot||e.id)}</small></td><td>${esc(m?.name||'—')}<small>${esc(e.supplier)}</small></td><td class="num">${num(e.qty)} ${esc(m?.unit)}</td><td class="num">${money(e.qty*e.unitCost)}</td><td>${esc(e.actor)}</td></tr>`;}).join('')}</tbody></table></div>`:empty('Nenhuma entrada registrada.'),null,{wide:true,buttons:btn('Exportar CSV','export-materials','','','download')});}
  function sourceRow(r={materialId:'',percent:100}){return `<div class="source-row"><select name="sourceMaterial" aria-label="Matéria-prima da composição" required>${opts([['','Selecione a matéria-prima'],...S.materials.map(m=>[m.id,m.name])],r.materialId)}</select><input name="sourcePercent" value="${r.percent}" type="number" min="0.01" step="0.01" aria-label="Participação percentual" required>${ibtn('Remover matéria-prima','remove-row','','trash')}</div>`;}
  function labelForm(id,copy=false,forcedType='',stagePiece=null,carry=null){let l=id?D.clone(S.labels.find(l=>l.id===id)):null;if(carry)l={...l,...carry};if(copy&&l){l.name='Cópia · '+l.name;if(l.type==='barcode')l.code='';}const type=forcedType||l?.type||'composition';const stageDraft=stagePiece?getStageDraft():null;
    if(id&&!copy&&S.pieces.some(p=>p.compositionLabel===id||p.barcodeLabel===id)){showDialog('Etiqueta vinculada à produção',`<p class="description">Essa etiqueta já está vinculada a uma peça. Para preservar a composição e o código utilizados, crie uma nova versão a partir deste modelo.</p>`,null,{buttons:btn('Duplicar modelo','duplicate-label',id,'primary','copy')});return;}
    showDialog(copy?'Duplicar modelo de etiqueta':id?'Editar etiqueta':'Criar etiqueta',`<div class="form-grid">${select('Tipo de etiqueta','type',[['composition','Etiqueta de composição'],['barcode','Etiqueta de código de barras']],type,(forcedType||id)?'disabled':'id="label-type"')}${field('Nome do modelo *','name',l?.name||'','text','required maxlength="90"')}${field('Marca','brand',l?.brand||'BY CAROLA','text','maxlength="70"')}${field('Tamanho (opcional)','size',l?.size||'','text','maxlength="20"')}${type==='composition'?`<div class="wide"><div class="form-section-title">Matérias-primas e participação na composição (%)</div><div class="grade-rows" id="source-rows">${(l?.sources||[{materialId:'',percent:100}]).map(sourceRow).join('')}</div><div class="mt">${btn('Adicionar matéria-prima','add-source','','sm plain','plus')}</div><p class="field-help">Informe os percentuais de participação de cada material. A soma é livre, inclusive acima de 100%, e os valores não são normalizados. A composição das fibras é calculada pelos percentuais informados.</p><div class="notice green mt" id="computed-composition">Selecione as matérias-primas para visualizar a composição.</div></div>${careFields(l?.careSymbols||{})}${area('Instruções complementares de cuidado','care',l?.care||'','placeholder="Orientações adicionais para a peça."')}`:`<div class="wide">${field('Código EAN-13 *','code',l?.code||'','text','required inputmode="numeric" maxlength="13" pattern="[0-9]{12,13}" placeholder="12 dígitos + verificador automático"')}<p class="field-help">O dígito verificador será calculado para entradas de 12 dígitos. Use códigos de teste durante a demonstração.</p></div>`}</div>`,async form=>{const data=Object.fromEntries(new FormData(form));data.type=type;data.careSymbols=Object.fromEntries(Object.keys(CARE_OPTIONS).map(k=>[k,form.elements['care_'+k]?.value||'']));if(type==='composition')data.sources=rowsFrom(form,'.source-row',r=>({materialId:r.querySelector('select').value,percent:r.querySelector('input').value}));await mutate(s=>{const label=D.upsertLabel(s,data,copy?undefined:id);if(stagePiece){const p=D.piece(s,stagePiece);D.updateStep(s,stagePiece,{...(stageDraft||p.steps[p.stage]),[type==='composition'?'compositionLabel':'barcodeLabel']:label.id});}},stagePiece?'Etiqueta criada e vinculada à etapa.':'Etiqueta salva.');$('#dialog').close();},{wide:true,subtitle:stagePiece?'A etiqueta será vinculada à etapa atual ao salvar.':''});updateComputedComposition();}
  function updateComputedComposition(){const out=$('#computed-composition');if(!out)return;const src=$$('.source-row').map(r=>({materialId:r.querySelector('select').value,percent:Number(r.querySelector('input').value)}));try{const total=src.reduce((a,r)=>a+r.percent,0);const comp=D.aggregate(S,src);out.textContent=compositionText(comp)+` · Participação total informada: ${num(total)}% · Sem normalização`;out.className='notice green mt';}catch{out.textContent='Selecione as matérias-primas e informe os percentuais de participação.';out.className='notice mt';}}
  function showLabel(id){const l=S.labels.find(l=>l.id===id);if(!l)return;showDialog('Prévia da etiqueta',`<div class="label-editor-preview">${labelPreview(l)}</div><p class="small muted mt">${esc(l.name)} · ${l.type==='composition'?'Composição calculada a partir dos materiais.':'EAN-13 com dígito verificador validado.'}</p>`,null,{buttons:btn('Imprimir etiqueta','print-label',id,'primary','print')});}
  function download(name,blob){permissions.assertExport();const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);}
  function csv(name,rows){const text='\ufeff'+rows.map(row=>row.map(v=>{let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}).join(';')).join('\r\n');download(name,new Blob([text],{type:'text/csv;charset=utf-8'}));}
  function exportPieces(){csv('producao_pecas.csv',[['Referência','Peça','Categoria','Cor','Coleção','Etapa','Responsável','Status','Prioridade','Prazo','Tamanho','Quantidade','Arquivada'],...filteredPieces().flatMap(p=>p.grade.map(g=>[p.ref,p.name,p.category,p.color,p.collection,`${p.stage+1}. ${D.STAGES[p.stage].name}`,ownerName(p.steps[p.stage].owner),p.steps[p.stage].status,p.priority,p.due,g.size,g.qty,p.archived?'Sim':'Não']))]);}
  function exportEntries(){csv('entradas_pecas_finalizadas.csv',[['Entrada','Data','Referência','Peça','Cor','Tamanho','Normal','Segunda linha','Rejeitadas','Avaliação','Responsável'],...S.stockEntries.flatMap(e=>e.rows.map(r=>[e.id,e.date,e.ref,e.name,e.color,r.size,r.normal,r.second,r.rejected,e.approval,ownerName(e.owner)]))]);}
  function printPiece(id){permissions.assertExport();const p=D.piece(S,id);$('#print-area').innerHTML=`<h1>Ficha de produção · ${esc(p.ref)}</h1><h2>${esc(p.name)}</h2><p>${esc(p.collection)} · ${esc(p.color)} · Prazo: ${date(p.due)}</p><h2>Grade</h2><table><thead><tr><th>Tamanho</th><th>Quantidade</th></tr></thead><tbody>${p.grade.map(g=>`<tr><td>${esc(g.size)}</td><td>${g.qty}</td></tr>`).join('')}</tbody></table><h2>Etapas</h2><table><thead><tr><th>Etapa</th><th>Responsável</th><th>Status</th><th>Observações</th></tr></thead><tbody>${D.STAGES.map((s,i)=>`<tr><td>${i+1}. ${s.name}</td><td>${esc(ownerName(p.steps[i].owner))}</td><td>${esc(p.steps[i].status)}</td><td>${esc(p.steps[i].notes)}</td></tr>`).join('')}</tbody></table>${p.quality?`<h2>Avaliação: ${esc(p.quality.approval)}</h2><p>${esc(p.quality.note)}</p><p>Normal: ${qualitySum(p,'normal')} · Segunda linha: ${qualitySum(p,'second')} · Rejeitadas: ${qualitySum(p,'rejected')}</p>`:''}<p class="print-note">Fluxo Moda · Demonstração · ${datetime(D.now())}</p>`;window.print();}
  async function uploadFiles(input){permissions.assertEdit();if(!input.files.length)return;const p=D.piece(S,currentId),draft=getStageDraft(),size=input.dataset.upload;const files=[...input.files];if(files.some(f=>f.size>8*1024*1024)){toast('Cada anexo pode ter até 8 MB.',true);input.value='';return;}const read=f=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve({name:f.name,type:f.type||'application/octet-stream',bytes:f.size,size,data:r.result});r.onerror=()=>reject(new Error('Não foi possível ler '+f.name));r.readAsDataURL(f);});const data=await Promise.all(files.map(read));await mutate(s=>{D.attach(s,p.id,data);prepareStep(s,p.id,draft);},'Anexos adicionados e salvos.');}
  function findAttachment(id){const p=D.piece(S,currentId);return p.steps.flatMap(t=>t.files).find(f=>f.id===id);}
  async function downloadAttachment(id){permissions.assertExport();const f=findAttachment(id);if(!f)return;const res=await fetch(f.data);download(f.name,await res.blob());}
  async function importBackup(input){if(embedded){managementBackupNotice();if(input)input.value='';return;}permissions.assertEdit();const file=input.files[0];if(!file)return;try{const parsed=D.validateBackup(JSON.parse(await file.text()));confirmAction('Restaurar backup?',`O arquivo <strong>${esc(file.name)}</strong> contém ${parsed.pieces.length} referência(s). Os dados atuais serão substituídos.`,async()=>{permissions.assertEdit();await DB.save(parsed);S=parsed;currentId=null;publishProduction();render();toast('Backup restaurado.');},'Restaurar backup');}catch(e){toast('Backup inválido: '+e.message,true);}input.value='';}
  function exportBackup(){if(embedded){managementBackupNotice();return;}permissions.assertExport();download('fluxo_moda_producao_backup_'+D.today()+'.json',new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));}
  function resetDemo(){if(embedded){managementBackupNotice();return;}permissions.assertEdit();confirmAction('Reiniciar a demonstração?','Isso substituirá todos os dados e anexos deste navegador pelos exemplos iniciais. Exporte um backup se quiser preservar as alterações.',async()=>{permissions.assertEdit();const next=window.createProductionSeed();await DB.save(next);S=next;publishProduction();render();toast('Demonstração reiniciada.');},'Reiniciar demonstração');}
  const actions={
    'mobile-menu':()=>{$('#sidebar').classList.add('open');$('.veil').classList.add('visible');},
    'mobile-close':()=>{$('#sidebar').classList.remove('open');$('.veil').classList.remove('visible');},
    'view':id=>{U.view=id;render();},'phase':id=>{U.phase=id;render();if($('#kanban'))$('#kanban').scrollLeft=0;},
    'scroll-board':id=>$('#kanban')?.scrollBy({left:Number(id)*287,behavior:'smooth'}),
    'new-piece':()=>pieceForm(), 'edit-piece':id=>pieceForm(id), 'copy-piece':id=>pieceForm(id,true), 'open-piece':id=>openPiece(id),
    'close-dialog':()=>$('#dialog').close(),
    'close-piece':()=>guardDetail(()=>{$('#piece-dialog').close();currentId=null;}),
    'confirm-action':async()=>{const fn=confirmCallback;confirmCallback=null;$('#dialog').close();if(fn)await fn();},
    'detail-tab':id=>guardDetail(()=>{detailTab=id;renderPiece();}),
    'view-stage':id=>guardDetail(()=>{viewedStage=Number(id);detailTab='stage';renderPiece();}),
    'save-stage':async id=>{const draft=getStageDraft();if(draft)await mutate(s=>D.updateStep(s,id,draft),'Etapa salva.');},
    'advance-piece':id=>movePiece(id,D.piece(S,id).stage+1),
    'return-piece':id=>returnPiece(id),
    'reopen-piece':id=>returnPiece(id,null,true), 'quality':id=>finalForm(id),
    'archive-piece':id=>confirmAction(D.piece(S,id).archived?'Restaurar peça?':'Arquivar peça?',D.piece(S,id).archived?'A peça voltará ao quadro na mesma etapa.':'A peça sairá do quadro ativo, preservando os anexos e o histórico. Você poderá restaurá-la pelo filtro de arquivadas.',async()=>{await mutate(s=>D.archive(s,id),'Atualização registrada.');},D.piece(S,id).archived?'Restaurar':'Arquivar'),
    'add-grade':()=>$('#grade-rows').insertAdjacentHTML('beforeend',gradeRow()),
    'add-fiber':()=>{$('#composition-rows').insertAdjacentHTML('beforeend',compositionRow({fiber:'',percent:0}));updateMaterialCompositionTotal();},
    'add-source':()=>$('#source-rows').insertAdjacentHTML('beforeend',sourceRow({materialId:'',percent:0})),
    'remove-row':(_,el)=>{el.closest('.grade-row,.composition-row,.source-row').remove();updateComputedComposition();updateMaterialCompositionTotal();},
    'download-attachment':id=>downloadAttachment(id),
    'remove-attachment':id=>{const pId=currentId,draft=getStageDraft();confirmAction('Remover anexo?',`O arquivo <strong>${esc(findAttachment(id)?.name)}</strong> será removido. A ação permanecerá no histórico.`,async()=>{await mutate(s=>{D.removeAttachment(s,pId,id);if(draft)D.updateStep(s,pId,{...draft,status:'Em andamento'});},'Anexo removido.');},'Remover anexo');},
    'edit-person':id=>personForm(id), 'edit-material':id=>materialForm(id),
    'receive-material':id=>receiveForm(id), 'material-history':materialHistory,
    'new-label':()=>labelForm(), 'edit-label':id=>labelForm(id),
    'duplicate-label':id=>labelForm(id,true), 'create-stage-label':type=>labelForm(null,false,type,currentId),
    'preview-label':id=>showLabel(id), 'delete-label':id=>confirmAction('Excluir etiqueta?','A etiqueta será excluída se ainda não estiver vinculada a uma produção.',async()=>{await mutate(s=>D.removeLabel(s,id),'Etiqueta excluída.');},'Excluir etiqueta'),
    'print-label':id=>{permissions.assertExport();$('#print-area').innerHTML=`<div class="print-labels">${labelPreview(S.labels.find(l=>l.id===id))}</div><p class="print-note">Etiqueta de demonstração · Ajuste a escala de impressão conforme sua impressora.</p>`;window.print();},
    'print-piece':printPiece,'export-pieces':exportPieces,'export-entries':exportEntries,
    'export-materials':()=>csv('entradas_materias_primas.csv',[['Entrada','Material','Quantidade','Unidade','Custo unitário','Custo total','Data','Lote','Fornecedor','Observação'],...S.materialEntries.map(e=>{const m=S.materials.find(m=>m.id===e.materialId);return [e.id,m?.name,e.qty,m?.unit,e.unitCost,e.unitCost*e.qty,e.date,e.lot,e.supplier,e.note];})]),
    'export-backup':exportBackup, 'open-management-settings':openManagementSettings,
    'reset-demo':resetDemo
  };
  document.addEventListener('click',async e=>{const a=e.target.closest('[data-action]');if(a){e.preventDefault();try{assertActionAccess(a.dataset.action);await actions[a.dataset.action]?.(a.dataset.id,a);}catch(err){toast(err.message||'Não foi possível concluir a operação.',true);const errEl=$('#piece-error');if(errEl&&$('#piece-dialog').open)errEl.textContent=err.message;}return;}const cardEl=e.target.closest('[data-piece]');if(cardEl&&!dragId)openPiece(cardEl.dataset.piece);});
  document.addEventListener('keydown',e=>{const c=e.target.closest('[data-piece]');if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openPiece(c.dataset.piece);}});
  document.addEventListener('submit',async e=>{if(e.target.id==='stage-form'){e.preventDefault();try{await actions['save-stage'](currentId);}catch(err){$('#piece-error').textContent=err.message;}return;}if(e.target.id!=='modal-form')return;e.preventDefault();if(!dialogSubmit)return;const submit=e.target.querySelector('[type=submit]');if(submit)submit.disabled=true;try{permissions.assertEdit();await dialogSubmit(e.target);}catch(err){const box=$('#modal-error');if(box)box.textContent=err.message;else toast(err.message,true);}finally{if(submit)submit.disabled=false;}});
  document.addEventListener('input',e=>{if(e.target.dataset.filter){U[e.target.dataset.filter]=e.target.value;render();}if(e.target.closest('#stage-form'))dirty=true;if(e.target.closest('[data-quality-size]'))updateQualityTotals();if(e.target.closest('.source-row'))updateComputedComposition();if(e.target.matches('[data-yield]'))updateYield();if(e.target.closest('.composition-row'))updateMaterialCompositionTotal();if(e.target.matches('[data-care-select]'))updateCarePreview();});
  document.addEventListener('change',async e=>{try{const t=e.target;
    if(t.dataset.filter){U[t.dataset.filter]=t.value;render();}
    if(t.id==='show-archived'){U.archived=t.checked;render();}
    if(t.id==='jump-stage'&&t.value!==''){$(`[data-stage="${t.value}"]`)?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'start'});}
    if(t.id==='actor')await mutate(s=>{s.actor=t.value;},'Usuário da demonstração alterado.');
    if(t.matches('[data-upload]'))await uploadFiles(t);
    if(t.id==='import-backup')await importBackup(t);
    if(t.id==='label-type'){const f=$('#modal-form'),carry=Object.fromEntries(new FormData(f));carry.type=t.value;labelForm(null,false,'',null,carry);}
    if(t.closest('#modal-form')&&t.name==='approval'){const reject=t.value==='Reprovado';$$('[data-quality-size]').forEach(r=>{r.querySelector('[name=normal]').value=reject?0:r.dataset.planned;r.querySelector('[name=second]').value=0;r.querySelector('[name=rejected]').value=reject?r.dataset.planned:0;});updateQualityTotals();}
    if(t.closest('.source-row'))updateComputedComposition();if(t.matches('[data-care-select]'))updateCarePreview();
  }catch(err){toast(err.message,true);}});
  document.addEventListener('dragstart',e=>{if(!permissions.canEdit){e.preventDefault();return;}const c=e.target.closest('[data-piece]');if(!c)return;dragId=c.dataset.piece;e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move';c.classList.add('dragging');});
  document.addEventListener('dragover',e=>{const lane=e.target.closest('[data-stage]');if(lane&&dragId){e.preventDefault();e.dataTransfer.dropEffect='move';$$('.lane.drag-over').forEach(x=>x.classList.remove('drag-over'));lane.classList.add('drag-over');}});
  document.addEventListener('drop',e=>{const lane=e.target.closest('[data-stage]');if(lane&&dragId){e.preventDefault();const id=dragId;dragId=null;$$('.lane.drag-over,.piece-card.dragging').forEach(x=>x.classList.remove('drag-over','dragging'));try{movePiece(id,Number(lane.dataset.stage));}catch(err){toast(err.message,true);}}});
  document.addEventListener('dragend',()=>{dragId=null;$$('.lane.drag-over,.piece-card.dragging').forEach(x=>x.classList.remove('drag-over','dragging'));});
  $('#piece-dialog').addEventListener('cancel',e=>{if(dirty){e.preventDefault();guardDetail(()=>{$('#piece-dialog').close();currentId=null;});}else currentId=null;});
  window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
  window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(routes[next]){U.route=next;U.q='';render();window.scrollTo(0,0);}});
  try{await DB.open();S=await DB.read();if(!S||S.schema!==1){S=window.createProductionSeed();await DB.save(S);}D.validateBackup(S);S.pieces.forEach(p=>{p.lot=p.lot||p.id;});applyActor(pendingActor);window.CarolaProduction={get state(){return S},get access(){return {edit:permissions.canEdit,export:permissions.canExport}},domain:D,mutate,publish:publishProduction};render();publishProduction();}catch(err){$('#app').innerHTML=`<div class="loading"><strong>Não foi possível abrir o protótipo</strong><p>${esc(err.message)}</p><p>Abra em um navegador atualizado e permita o armazenamento local.</p></div>`;}
})();

</script>
